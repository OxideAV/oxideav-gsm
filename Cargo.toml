[package]
name = "oxideav-gsm"
version = "0.0.10"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mark Karpeles"]
description = "Pure-Rust GSM Full Rate (ETSI 06.10, RPE-LTP) speech codec — clean-room rebuild in progress"
repository = "https://github.com/OxideAV/oxideav-gsm"
homepage = "https://github.com/OxideAV/oxideav-gsm"
readme = "README.md"
# The ETSI conformance corpus (≈5 MB of reference vectors) stays in the
# git repo for CI but out of the published package; the conformance
# tests that read it skip gracefully when the directory is absent.
exclude = ["tests/fixtures/etsi-fr", "tests/fixtures/etsi-vad", "tests/fixtures/etsi-hr"]
keywords = ["multimedia", "audio", "gsm", "telephony", "codec"]
categories = ["multimedia::encoding", "multimedia::audio"]

[dependencies]
oxideav-core = "0.1"
